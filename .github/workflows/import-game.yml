name: Import verified game

on:
  push:
    branches: [main]
    paths: ['.publish/ready']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore and verify original HTML
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib, lzma
          pieces = sorted(Path('.publish').glob('part-*.txt'))
          assert len(pieces) == 4, 'Expected four upload parts'
          packed = ''.join(p.read_text().strip() for p in pieces)
          html = lzma.decompress(base64.b64decode(packed, validate=True))
          assert len(html) == 210359, 'Incomplete game upload'
          assert hashlib.sha256(html).hexdigest() == 'bb22683a8dbae4d59e705e2945ce7640ff6735e6b4c0d2e9de877c83a0fa11d2', 'Game integrity check failed'
          assert b'Castle &amp; Secret Worlds' in html
          Path('index.html').write_bytes(html)
      - name: Save game in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm -r .publish
          git commit -m 'Publish complete verified Fluff Dash Secret Worlds game'
          git push
